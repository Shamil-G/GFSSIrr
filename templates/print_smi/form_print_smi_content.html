<form class="irr-form"
      method="POST"
      data-target-url="/form_print_smi"
      action=""
      style="grid-template-columns: 360px 1fr;" enctype="multipart/form-data">

    {% if data.prot_num %}
    <div class="form-row">
        <label for="prot_num">{{ res_value('PROTOCOL_NUM') }}</label>
        <input id="event_date" style="font-size: 16px; background: inherit; border:none" type="text" name="prot_num" value="{{ data.prot_num }}" readonly>
    </div>
    {% endif %}

    <div class="form-row">
        <label for="event_date">{{ res_value('EVENT_DATE') }}</label>
        <input id="event_date" class="input_d" style="max-width: 132px" type="date" name="event_date" value="{{ data.event_date.strftime('%Y-%m-%d') if data.event_date else '' }}" required>
    </div>

    <div class="form-row">
        <label for="region-select">{{ res_value('SELECT_REGION') }}</label>
        <select id="region-select" class="input_s" style="min-width: 274px" name="rfbn_id" value="{{ data.rfbn_id }}" required>
            {% for code, region in regions.items() %}
            <option value="{{ code[:2] }}"
                    {% if code[:2] in data.rfbn_id %}selected{% endif %}>
                {{ region.legacy_name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-row">
        <label for="smi_name">{{ res_value('SMI_NAME') }}</label>
        <input id="smi_name" class="input_s" type="text" name="smi_name" style="min-width: 480px" value="{{ data.smi_name }}" required>
    </div>

    <div class="form-row">
        <label for="description" style="white-space: normal; word-wrap: break-word; overflow-wrap: break-word; ">{{ res_value('DESCRIPTION_SMI') }}</label>
        <input id="description" class="input_s" type="text" name="description" style="min-width: 880px" value="{{ data.description }}">
    </div>

    <div class="form-row form-actions">
        <button type="submit" style="justify-self: center; width: auto; padding: 8px 32px; margin-top: 10px">{{ res_value('BUTTON_SAVE') }}</button>
        <span class="save-message" style="white-space: pre-line; padding: 0px; margin: 0px; font-weight: bold; font-size: 16px; line-height: 0.8; color: green">{{ message }}</span>
    </div>

</form>
